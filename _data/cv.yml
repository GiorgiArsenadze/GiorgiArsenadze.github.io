      institution: New York University, NY
      year: 05.2021 - 05.2026
      description:
        - Developed and tested advanced cosmological dark matter models (including Cannibal Dark Matter and Dark Photons) using Python, C++, and the state-of-the-art CLASS evolution solver. 
        - Built multi-module computational software in Python and C++ to simulate complex dark matter and cosmological phenomena.
        - Integrated multi-gigabyte observational data from cosmological surveys to constrain parameter spaces, achieving factors of magnitude better limits on dark matter properties
        -  Optimized computational pipelines on HPC clusters, 20-fold improving calculation speed 20-fold speedup and efficiency by a factor of 10 through refined code structure and parallel computation.
    - title: Research Assistant in Biophysics
      institution: New York University, NY
      year: 05.2020 - 09.2023
      description:
        - Developed a data-driven theoretical and computational model to describe the dynamics of nucleoli—droplet-like organelles within human cell nuclei.
        - Designed automated image-analysis workflows to process multi-gigabyte nucleolar data from HeLa cells.
        - Built 3D simulations in MATLAB/Python to study nucleoli dynamics, incorporating spatiotemporally varying interaction forces.
        - Validated the model by combining experimental microscopy data with simulations to reproduce observed behaviors with less than 5% deviation from empirical measurements.

